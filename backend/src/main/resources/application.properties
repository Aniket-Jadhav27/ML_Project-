# Spring Boot Application Properties
# ─────────────────────────────────────────────────────────────────
# PRODUCTION NOTE: Set all values via environment variables or a
# local application-local.properties (which is git-ignored).
# Never commit real passwords or secrets to version control.
# ─────────────────────────────────────────────────────────────────

server.port=8080

# Automatically load local credentials if application-local.properties exists (git-ignored)
spring.config.import=optional:classpath:application-local.properties

# MySQL Configuration
# Override with env vars: SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME, SPRING_DATASOURCE_PASSWORD
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/rag_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:changeme}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# File Upload limit
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# JWT Settings
# Override with env var: APP_JWT_SECRET (use a 64-char random hex string in production)
app.jwt.secret=${APP_JWT_SECRET:replace-this-with-a-long-random-secret-in-production}
app.jwt.expiration-ms=86400000

# RAG Python Engine URL
# Override with env var: APP_RAG_SERVICE_URL
app.rag.service-url=${APP_RAG_SERVICE_URL:http://127.0.0.1:8000}
